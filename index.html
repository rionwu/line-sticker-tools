<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LINE 動態貼圖專業製作工具 (Mobile Optimized)</title>
    <!-- 引入全球穩定 CDN 套件 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/1.0.11/pako.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/upng-js@2.1.0/UPNG.min.js"></script>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #10b981;
            --danger: #ef4444;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --border: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --radius-lg: 16px;
            --radius-md: 10px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text-main); padding: 12px; min-height: 100vh; }
        .container { max-width: 600px; margin: 0 auto; }

        /* App Header */
        .app-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; padding: 4px 0; }
        .app-title { font-size: 1.2rem; font-weight: 800; color: var(--text-main); display: flex; align-items: center; gap: 8px; }
        .app-badge { background: #312e81; color: #818cf8; font-size: 0.75rem; padding: 2px 8px; border-radius: 99px; font-weight: 700; }

        /* Card Styles */
        .card { background: var(--card-bg); padding: 16px; border-radius: var(--radius-lg); border: 1px solid var(--border); margin-bottom: 16px; }
        .step-title { font-size: 1rem; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; color: var(--text-main); }
        .step-num { background: var(--primary); color: white; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: 800; flex-shrink: 0; }

        /* Upload Area */
        .upload-area { border: 2px dashed #475569; border-radius: var(--radius-md); padding: 28px 16px; text-align: center; cursor: pointer; background: #0f172a; }
        .upload-area:active { background: #1e1b4b; border-color: var(--primary); }
        .upload-icon { font-size: 2rem; margin-bottom: 6px; display: block; }

        /* Stage Area */
        .stage-container { position: relative; display: block; width: 100%; user-select: none; touch-action: none; border-radius: var(--radius-md); overflow: hidden; background: #000; border: 1px solid var(--border); }
        video { width: 100%; display: block; background: #000; }
        canvas.overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; cursor: crosshair; }

        /* Controls Panel */
        .control-panel { background: #0f172a; border: 1px solid var(--border); padding: 12px; border-radius: var(--radius-md); margin-top: 12px; display: flex; flex-direction: column; gap: 12px; }
        .control-group h4 { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 6px; font-weight: 600; }
        .slider-item { display: flex; align-items: center; gap: 10px; font-size: 0.85rem; font-weight: 600; min-height: 40px; }
        .slider-item input[type="range"] { flex: 1; accent-color: var(--primary); height: 24px; }

        /* Buttons & Touch Target */
        .btn { background: var(--primary); color: white; border: none; padding: 12px; border-radius: var(--radius-md); font-weight: 700; cursor: pointer; width: 100%; font-size: 0.95rem; min-height: 48px; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .btn:active { opacity: 0.8; transform: scale(0.98); }
        .btn:disabled { background: #475569; color: #94a3b8; cursor: not-allowed; }
        .btn-auto { background: var(--success); }
        .btn-sec { background: #0284c7; }
        .btn-danger { background: var(--danger); color: white; }
        
        input[type="number"].grid-input { width: 60px; height: 36px; padding: 4px; border-radius: 6px; border: 1px solid var(--border); font-size: 1rem; font-weight: bold; text-align: center; background: #0f172a; color: #fff; }

        /* Grid Items */
        .stickers-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 12px; }
        .sticker-card { border: 1px solid var(--border); border-radius: var(--radius-md); padding: 10px; background: #0f172a; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .sticker-preview { width: 100px; height: 100px; background: #1e293b; border-radius: 8px; object-fit: contain; }

        /* Export Bar */
        .export-options-bar { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; background: #022c22; border: 1px solid #065f46; padding: 12px; border-radius: var(--radius-md); }
        .export-select { min-height: 44px; padding: 8px; border-radius: 8px; border: 1px solid var(--border); font-size: 0.85rem; font-weight: bold; background: #0f172a; color: #fff; outline: none; }

        /* Progress Bar */
        .progress-container { width: 100%; margin-top: 12px; display: none; }
        .progress-header { display: flex; justify-content: space-between; font-weight: bold; font-size: 0.85rem; margin-bottom: 4px; }
        .progress-bar-bg { width: 100%; height: 10px; background: #334155; border-radius: 5px; overflow: hidden; }
        .progress-bar-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #10b981, #06b6d4); transition: width 0.2s; }

        /* 📱 手機優化 Modal (全螢幕 + 上下分頁/滑動結構) */
        .modal-overlay { 
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; 
            background: #0f172a; z-index: 999; display: none; flex-direction: column; 
        }

        .modal-header { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 12px 16px; border-bottom: 1px solid var(--border); 
            background: #1e293b; height: 50px; flex-shrink: 0; 
        }

        /* 頁籤 Toggle (畫布 vs 編輯設定) */
        .tab-bar { display: flex; background: #0f172a; border-bottom: 1px solid var(--border); flex-shrink: 0; }
        .tab-btn { flex: 1; padding: 12px; text-align: center; font-size: 0.9rem; font-weight: bold; color: var(--text-muted); border: none; background: transparent; cursor: pointer; border-bottom: 2px solid transparent; }
        .tab-btn.active { color: #38bdf8; border-bottom-color: #38bdf8; background: #1e293b; }

        .modal-body-scroll { 
            flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; 
            display: flex; flex-direction: column; padding: 12px; gap: 12px;
        }

        /* 畫布檢視區 */
        .preview-box-wrapper { width: 100%; flex-shrink: 0; }
        .preview-box { 
            position: relative; width: 100%; height: 260px; 
            border-radius: var(--radius-md); overflow: hidden; background: #020617; 
            touch-action: none; display: flex; align-items: center; justify-content: center; 
            border: 1px solid var(--border); 
        }

        .preview-box.bg-light { background: #ffffff !important; }
        .preview-box.bg-dark { background: #0f172a !important; }
        .preview-box.bg-grid { 
            background-image: linear-gradient(45deg, #334155 25%, transparent 25%), linear-gradient(-45deg, #334155 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #334155 75%), linear-gradient(-45deg, transparent 75%, #334155 75%);
            background-size: 16px 16px; background-position: 0 0, 0 8px, 8px -8px, -8px 0px; background-color: #0f172a;
        }

        .bg-toggles { position: absolute; top: 8px; right: 8px; display: flex; gap: 4px; background: rgba(15, 23, 42, 0.85); padding: 4px; border-radius: 8px; z-index: 10; }
        .bg-toggle-btn { border: none; background: transparent; color: #94a3b8; padding: 4px 8px; border-radius: 6px; font-size: 0.8rem; }
        .bg-toggle-btn.active { background: #334155; color: #fff; }

        .mode-badge { position: absolute; top: 8px; left: 8px; background: rgba(15,23,42,0.85); color: #38bdf8; padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; border: 1px solid #334155; }

        #previewCanvas { transform-origin: center center; max-width: 100%; max-height: 100%; object-fit: contain; }

        /* 手機表單與控制控制項 */
        .mobile-controls { display: flex; flex-direction: column; gap: 12px; }
        .panel-section-title { font-size: 0.85rem; font-weight: bold; color: #38bdf8; border-bottom: 1px solid var(--border); padding-bottom: 4px; margin-top: 4px; }

        .frame-stepper { display: flex; justify-content: space-between; align-items: center; background: #1e293b; border: 1px solid var(--border); border-radius: 8px; min-height: 44px; padding: 0 8px; }
        .step-btn { border: none; background: transparent; color: #38bdf8; font-weight: bold; padding: 10px; font-size: 0.9rem; }
        .frame-indicator { font-size: 0.85rem; color: #94a3b8; font-weight: 600; }

        .tool-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .btn-outline { border: 1px solid var(--border); background: #1e293b; padding: 10px; border-radius: 8px; font-size: 0.85rem; font-weight: 600; color: #cbd5e1; min-height: 44px; display: flex; align-items: center; justify-content: center; }
        .btn-outline.active { border-color: var(--primary); color: #818cf8; background: #312e81; }

        textarea.text-input { width: 100%; height: 54px; padding: 8px; border-radius: 8px; border: 1px solid var(--border); font-size: 0.95rem; resize: none; outline: none; background: #1e293b; color: #fff; }

        .segmented-control { display: flex; background: #1e293b; padding: 3px; border-radius: 8px; border: 1px solid var(--border); min-height: 44px; }
        .segment-btn { flex: 1; border: none; background: transparent; border-radius: 6px; font-size: 0.8rem; font-weight: 600; color: #94a3b8; }
        .segment-btn.active { background: var(--primary); color: white; }

        select.select-input { height: 44px; padding: 0 8px; border-radius: 8px; border: 1px solid var(--border); font-size: 0.85rem; background: #1e293b; color: #fff; width: 100%; }

        .footer-bar { display: flex; justify-content: space-between; gap: 10px; padding: 10px 16px; border-top: 1px solid var(--border); background: #1e293b; flex-shrink: 0; }
        #status { font-weight: bold; color: #38bdf8; margin-top: 8px; text-align: center; font-size: 0.85rem; }
    </style>
</head>
<body>

<div class="container">
    <div class="app-header">
        <div class="app-title">
            <span>🎬 LINE 動態貼圖工作室</span>
            <span class="app-badge">Mobile 2.0</span>
        </div>
    </div>

    <div class="card">
        <div class="upload-area" onclick="document.getElementById('fileInput').click()">
            <span class="upload-icon">📁</span>
            <p style="font-weight: 700;">點擊上傳影片檔案</p>
            <p style="font-size: 0.75rem; color: var(--text-muted); margin-top: 4px;">支援 MP4 / WebM</p>
            <input type="file" id="fileInput" accept="video/*" style="display:none" onchange="loadVideo(event)">
        </div>
    </div>

    <div class="card" id="editorCard" style="display:none;">
        <div class="step-title">
            <span class="step-num">1</span>
            <span>定位網格與自動去背</span>
        </div>
        
        <div class="stage-container">
            <video id="mainVideo" loop muted playsinline></video>
            <canvas id="overlayCanvas" class="overlay"></canvas>
        </div>

        <div class="control-panel">
            <div class="control-group">
                <h4>網格排列設定</h4>
                <div class="slider-item">
                    <span>直排 (列):</span>
                    <input type="number" id="gridRows" class="grid-input" min="1" max="10" value="2" onchange="initGridLines()">
                    <span style="margin: 0 4px; color: var(--text-muted);">✕</span>
                    <span>橫排 (欄):</span>
                    <input type="number" id="gridCols" class="grid-input" min="1" max="10" value="2" onchange="initGridLines()">
                </div>
            </div>

            <div class="control-group" style="border-top: 1px solid var(--border); padding-top: 10px;">
                <h4>擷取秒數 / 幀數設定</h4>
                <div class="slider-item">
                    <span>擷取長度 (秒):</span>
                    <input type="number" id="captureDuration" class="grid-input" style="width:80px;" min="0.1" step="0.1" placeholder="整支影片" oninput="updateCaptureDurationHint()">
                </div>
                <div class="slider-item">
                    <span>總幀數:</span>
                    <input type="number" id="frameCountInput" class="grid-input" style="width:70px;" min="2" max="120" step="1" value="40" oninput="updateCaptureDurationHint()">
                    <span id="captureDurationHint" style="font-size:0.75rem; color:var(--text-muted);"></span>
                </div>
            </div>

            <div class="control-group" style="border-top: 1px solid var(--border); padding-top: 10px;">
                <div style="display:flex; align-items:center; gap:8px;">
                    <input type="checkbox" id="enableKeying" checked onchange="drawGrid()" style="width:20px; height:20px;">
                    <label for="enableKeying" style="font-size:0.85rem;"><b>開啟漫水去背</b></label>
                    <input type="color" id="keyColor" value="#000000" onchange="drawGrid()" style="border:none; width:32px; height:32px; cursor:pointer; border-radius:4px; background:none;">
                </div>
                <div class="slider-item" style="margin-top: 6px;">
                    <span>去背容許值:</span>
                    <input type="range" id="keyTolerance" min="5" max="150" value="45" oninput="document.getElementById('tolVal').innerText=this.value; drawGrid();">
                    <span id="tolVal" style="width: 28px; text-align: right;">45</span>
                </div>
            </div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 12px;">
            <button class="btn btn-auto" onclick="autoDetectGrid()">✨ 自動定位分割線</button>
            <button class="btn btn-sec" onclick="extractAllStickers()">✂️ 拆分貼圖</button>
        </div>
        <div id="status"></div>

        <div id="stickersListSection" style="display:none; margin-top: 20px; border-top: 1px solid var(--border); padding-top: 16px;">
            <div class="step-title">
                <span class="step-num">2</span>
                <span>貼圖微調與文字編輯</span>
            </div>

            <div class="stickers-grid" id="stickersGrid"></div>
            
            <div class="export-options-bar">
                <label for="exportFormatSelect" style="font-size:0.85rem;"><b>🎯 選擇 LINE 上架管道格式：</b></label>
                <select id="exportFormatSelect" class="export-select">
                    <option value="apng">🖼️ APNG 動態檔 (電腦版 Market)</option>
                    <option value="sequence">📁 PNG 影格資料夾 (手機版 拍貼 App)</option>
                </select>
                <button class="btn" id="exportBtn" style="margin-top: 4px;" onclick="exportAllStickersZip()">📦 打包下載 ZIP 檔案</button>
            </div>

            <div class="progress-container" id="progressContainer">
                <div class="progress-header">
                    <span id="progressText">準備打包...</span>
                    <span id="progressPercent">0%</span>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="progressBarFill"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 📱 全螢幕手機專用 Modal -->
<div class="modal-overlay" id="editorModal">
    <div class="modal-header">
        <span id="modalTitle" style="font-weight:bold; font-size:0.95rem;">編輯貼圖</span>
        <button onclick="closeModal()" style="border:none; background:transparent; color:#94a3b8; font-size:1.4rem; padding:4px 8px;">✕</button>
    </div>

    <!-- 頁籤分頁導覽 -->
    <div class="tab-bar">
        <button class="tab-btn active" id="tabBtnPreview" onclick="switchTab('preview')">🖼️ 畫布與動作</button>
        <button class="tab-btn" id="tabBtnText" onclick="switchTab('text')">✍️ 文字與樣式</button>
    </div>

    <div class="modal-body-scroll">
        <!-- 畫布區 (永遠放在最上方，便利手勢操作) -->
        <div class="preview-box-wrapper">
            <div class="preview-box bg-dark" id="previewContainer">
                <div class="mode-badge" id="modeBadge">🪄 點擊去背</div>
                <div id="boxSelectOverlay" style="position:absolute; display:none; border:2px dashed #38bdf8; background:rgba(56,189,248,0.18); pointer-events:none; z-index:5;"></div>
                
                <div class="bg-toggles">
                    <button class="bg-toggle-btn" onclick="setBg('light', this)">☀️</button>
                    <button class="bg-toggle-btn active" onclick="setBg('dark', this)">🌙</button>
                    <button class="bg-toggle-btn" onclick="setBg('grid', this)">🏁</button>
                </div>

                <canvas id="previewCanvas"></canvas>
            </div>
        </div>

        <!-- 分頁 1: 畫布控制與影格工具 -->
        <div class="mobile-controls" id="tabContentPreview">
            <div class="panel-section-title">🎬 影格播放控制</div>
            <div class="frame-stepper">
                <button class="step-btn" onclick="changeFrame(-1)">&lt; 上一幀</button>
                <span class="frame-indicator" id="frameDisplay">影格 1 / -</span>
                <button class="step-btn" onclick="changeFrame(1)">下一幀 &gt;</button>
            </div>

            <div class="tool-row">
                <button class="btn-outline active" id="btnModeToggle" onclick="toggleInteractionMode()">🪄 去背模式</button>
                <button class="btn-outline" id="btnPlay" onclick="togglePlay()">⊙ 播放預覽</button>
            </div>

            <div class="tool-row">
                <button class="btn-outline btn-danger" onclick="deleteCurrentFrame()">🗑️ 刪除此影格</button>
                <button class="btn-outline" onclick="undoLastAction()">↺ 上一步</button>
            </div>

            <div class="slider-item">
                <span style="font-size:0.8rem;">容許值</span>
                <input type="range" id="modalTolRange" min="5" max="120" value="30" oninput="document.getElementById('mTolVal').innerText=this.value;">
                <span id="mTolVal" style="width:24px; font-size:0.8rem;">30</span>
            </div>

            <div style="display:flex; align-items:center; gap:8px;">
                <input type="checkbox" id="boxInverseMode" style="width:18px; height:18px;">
                <label for="boxInverseMode" style="font-size:0.8rem;">框選還原（取消去背，找回被吃掉的主體）</label>
            </div>
        </div>

        <!-- 分頁 2: 文字編輯 -->
        <div class="mobile-controls" id="tabContentText" style="display:none;">
            <div class="panel-section-title">✍️ 貼圖文字設計</div>

            <textarea class="text-input" id="textContent" placeholder="輸入貼圖文字 (可在畫布拖曳)..." oninput="updateCurrentTextConfig('text', this.value)"></textarea>

            <div class="tool-row">
                <div>
                    <span style="font-size:0.75rem; color:#94a3b8; display:block; margin-bottom:4px;">文字方向</span>
                    <div class="segmented-control">
                        <button class="segment-btn active" id="btnDirHoriz" onclick="setTextDir('horiz', this)">橫式</button>
                        <button class="segment-btn" id="btnDirVert" onclick="setTextDir('vert', this)">直式</button>
                    </div>
                </div>
                <div>
                    <span style="font-size:0.75rem; color:#94a3b8; display:block; margin-bottom:4px;">圖層順序</span>
                    <div class="segmented-control">
                        <button class="segment-btn active" id="btnLayerFront" onclick="setTextLayer('front', this)">前景</button>
                        <button class="segment-btn" id="btnLayerBack" onclick="setTextLayer('back', this)">背景</button>
                    </div>
                </div>
            </div>

            <div class="tool-row">
                <div>
                    <span style="font-size:0.75rem; color:#94a3b8; display:block; margin-bottom:4px;">字型</span>
                    <select class="select-input" id="fontFamily" onchange="updateCurrentTextConfig('fontFamily', this.value)">
                        <option value="sans-serif">黑體 / Sans</option>
                        <option value="serif">明體 / Serif</option>
                        <option value="cursive">楷體 / Kai</option>
                    </select>
                </div>
                <div>
                    <span style="font-size:0.75rem; color:#94a3b8; display:block; margin-bottom:4px;">字體粗細</span>
                    <select class="select-input" id="fontWeight" onchange="updateCurrentTextConfig('fontWeight', this.value)">
                        <option value="bold">粗體</option>
                        <option value="normal">一般</option>
                    </select>
                </div>
            </div>

            <div class="slider-item">
                <span style="font-size:0.8rem;">字體大小</span>
                <input type="range" id="fontSize" min="12" max="60" value="26" oninput="updateCurrentTextConfig('fontSize', parseInt(this.value))">
            </div>

            <div class="tool-row" style="align-items:center;">
                <div class="slider-item">
                    <span style="font-size:0.8rem;">文字顏色</span>
                    <input type="color" id="textColor" value="#ffffff" onchange="updateCurrentTextConfig('textColor', this.value)" style="border:none; background:none; cursor:pointer; width:36px; height:36px;">
                </div>
                <div class="slider-item">
                    <span style="font-size:0.8rem;">外框顏色</span>
                    <input type="color" id="strokeColor" value="#000000" onchange="updateCurrentTextConfig('strokeColor', this.value)" style="border:none; background:none; cursor:pointer; width:36px; height:36px;">
                </div>
            </div>
        </div>
    </div>

    <div class="footer-bar">
        <button class="btn-outline" style="width:100px;" onclick="closeModal()">取消</button>
        <button class="btn" style="flex:1;" onclick="saveModalChanges()">✓ 完成修復</button>
    </div>
</div>

<script>
    const video = document.getElementById('mainVideo');
    const overlay = document.getElementById('overlayCanvas');
    const ctx = overlay.getContext('2d');
    let videoWidth = 0, videoHeight = 0;

    let cropBox = { left: 0, top: 0, right: 0, bottom: 0 };
    let verticalLines = [];
    let horizontalLines = [];
    let draggingTarget = null;

    let stickerDataMap = {}; 
    let activeEditingStickerId = null;
    let currentModalFrame = 0;
    let isPlaying = false, playInterval = null;
    let undoStack = [];

    let isDraggingText = false;
    let zoomScale = 1;
    let panOffset = { x: 0, y: 0 };
    let currentMode = 'wand'; 
    let isPanning = false;
    let startPan = { x: 0, y: 0 };
    let initialPinchDistance = null;
    let boxSelecting = false;
    let boxSelectStartClient = null;
    let boxSelectCurrentClient = null;

    function switchTab(tab) {
        document.getElementById('tabBtnPreview').classList.toggle('active', tab === 'preview');
        document.getElementById('tabBtnText').classList.toggle('active', tab === 'text');
        document.getElementById('tabContentPreview').style.display = tab === 'preview' ? 'flex' : 'none';
        document.getElementById('tabContentText').style.display = tab === 'text' ? 'flex' : 'none';
    }

    function loadVideo(e) {
        const file = e.target.files[0];
        if (!file) return;
        video.src = URL.createObjectURL(file);
        video.onloadedmetadata = () => {
            videoWidth = video.videoWidth; videoHeight = video.videoHeight;
            overlay.width = videoWidth; overlay.height = videoHeight;
            cropBox = { left: 0, top: 0, right: videoWidth, bottom: videoHeight };
            document.getElementById('editorCard').style.display = 'block';

            // Default the capture-duration field to the video's real length so the
            // extraction covers the whole clip instead of being silently cut short.
            const capInput = document.getElementById('captureDuration');
            if (isFinite(video.duration) && video.duration > 0) {
                capInput.value = video.duration.toFixed(2);
                capInput.placeholder = '';
            }
            updateCaptureDurationHint();

            video.play();
            initGridLines();
            setupDragEvents();
        };
    }

    function initGridLines() {
        const rows = parseInt(document.getElementById('gridRows').value);
        const cols = parseInt(document.getElementById('gridCols').value);
        if (!rows || !cols) return;
        verticalLines = []; horizontalLines = [];
        const activeW = cropBox.right - cropBox.left;
        const activeH = cropBox.bottom - cropBox.top;
        for (let i = 1; i < cols; i++) verticalLines.push(cropBox.left + (activeW / cols) * i);
        for (let j = 1; j < rows; j++) horizontalLines.push(cropBox.top + (activeH / rows) * j);
        drawGrid();
    }

    function autoDetectGrid() {
        const rows = parseInt(document.getElementById('gridRows').value);
        const cols = parseInt(document.getElementById('gridCols').value);
        if (!rows || !cols) return;

        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = videoWidth; tempCanvas.height = videoHeight;
        const tempCtx = tempCanvas.getContext('2d');
        tempCtx.drawImage(video, 0, 0, videoWidth, videoHeight);
        const imgData = tempCtx.getImageData(0, 0, videoWidth, videoHeight).data;

        const targetColor = hexToRgb(document.getElementById('keyColor').value);
        const tolerance = parseInt(document.getElementById('keyTolerance').value);

        const xDensity = new Array(videoWidth).fill(0);
        const yDensity = new Array(videoHeight).fill(0);

        for (let y = 0; y < videoHeight; y += 2) {
            for (let x = 0; x < videoWidth; x += 2) {
                const i = (y * videoWidth + x) * 4;
                const diff = Math.sqrt(Math.pow(imgData[i]-targetColor.r,2)+Math.pow(imgData[i+1]-targetColor.g,2)+Math.pow(imgData[i+2]-targetColor.b,2));
                if (diff >= tolerance && imgData[i+3] >= 20) { xDensity[x]++; yDensity[y]++; }
            }
        }

        let minX = xDensity.findIndex(v => v > 5), maxX = videoWidth - 1 - [...xDensity].reverse().findIndex(v => v > 5);
        let minY = yDensity.findIndex(v => v > 5), maxY = videoHeight - 1 - [...yDensity].reverse().findIndex(v => v > 5);

        if (minX !== -1 && maxX !== -1 && minY !== -1 && maxY !== -1) {
            const padding = 10;
            cropBox = { 
                left: Math.max(0, minX - padding), 
                top: Math.max(0, minY - padding), 
                right: Math.min(videoWidth, maxX + padding), 
                bottom: Math.min(videoHeight, maxY + padding) 
            };
            verticalLines = findSplitLines(xDensity, cropBox.left, cropBox.right, cols);
            horizontalLines = findSplitLines(yDensity, cropBox.top, cropBox.bottom, rows);
            drawGrid();
        }
    }

    function findSplitLines(densityArray, start, end, segments) {
        const lines = []; const step = (end - start) / segments;
        for (let i = 1; i < segments; i++) {
            const expected = Math.floor(start + step * i);
            const searchRange = Math.floor(step * 0.35);
            let minDensity = Infinity, bestPos = expected;
            for (let pos = expected - searchRange; pos <= expected + searchRange; pos++) {
                if (pos >= 0 && pos < densityArray.length && densityArray[pos] < minDensity) {
                    minDensity = densityArray[pos]; bestPos = pos;
                }
            }
            lines.push(bestPos);
        }
        return lines;
    }

    function drawGrid() {
        ctx.clearRect(0, 0, overlay.width, overlay.height);
        ctx.strokeStyle = '#818cf8'; ctx.setLineDash([6, 6]); ctx.lineWidth = 3;
        ctx.strokeRect(cropBox.left, cropBox.top, cropBox.right - cropBox.left, cropBox.bottom - cropBox.top);
        ctx.strokeStyle = '#38bdf8'; ctx.setLineDash([]); ctx.lineWidth = 2;
        verticalLines.forEach(x => { ctx.beginPath(); ctx.moveTo(x, cropBox.top); ctx.lineTo(x, cropBox.bottom); ctx.stroke(); });
        horizontalLines.forEach(y => { ctx.beginPath(); ctx.moveTo(cropBox.left, y); ctx.lineTo(cropBox.right, y); ctx.stroke(); });
    }

    function setupDragEvents() {
        const getCanvasPos = (e) => {
            const rect = overlay.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: (clientX - rect.left) * (videoWidth / rect.width), y: (clientY - rect.top) * (videoHeight / rect.height) };
        };
        const onStart = (e) => {
            const { x, y } = getCanvasPos(e); const tol = 30;
            if (Math.abs(x - cropBox.left) < tol) draggingTarget = { type: 'cropL' };
            else if (Math.abs(x - cropBox.right) < tol) draggingTarget = { type: 'cropR' };
            else if (Math.abs(y - cropBox.top) < tol) draggingTarget = { type: 'cropT' };
            else if (Math.abs(y - cropBox.bottom) < tol) draggingTarget = { type: 'cropB' };
            else {
                for (let i = 0; i < verticalLines.length; i++) if (Math.abs(x - verticalLines[i]) < tol) { draggingTarget = { type: 'vLine', index: i }; return; }
                for (let j = 0; j < horizontalLines.length; j++) if (Math.abs(y - horizontalLines[j]) < tol) { draggingTarget = { type: 'hLine', index: j }; return; }
            }
        };
        const onMove = (e) => {
            if (!draggingTarget) return;
            const { x, y } = getCanvasPos(e);
            if (draggingTarget.type === 'cropL') cropBox.left = Math.min(Math.max(0, x), cropBox.right - 10);
            else if (draggingTarget.type === 'cropR') cropBox.right = Math.max(Math.min(videoWidth, x), cropBox.left + 10);
            else if (draggingTarget.type === 'cropT') cropBox.top = Math.min(Math.max(0, y), cropBox.bottom - 10);
            else if (draggingTarget.type === 'cropB') cropBox.bottom = Math.max(Math.min(videoHeight, y), cropBox.top + 10);
            else if (draggingTarget.type === 'vLine') verticalLines[draggingTarget.index] = Math.min(Math.max(cropBox.left, x), cropBox.right);
            else if (draggingTarget.type === 'hLine') horizontalLines[draggingTarget.index] = Math.min(Math.max(cropBox.top, y), cropBox.bottom);
            drawGrid();
        };
        overlay.addEventListener('mousedown', onStart);
        overlay.addEventListener('touchstart', onStart, {passive: true});
        window.addEventListener('mousemove', onMove);
        window.addEventListener('touchmove', onMove, {passive: true});
        window.addEventListener('mouseup', () => draggingTarget = null);
        window.addEventListener('touchend', () => draggingTarget = null);
    }

    function hexToRgb(hex) {
        const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
        return result ? { r: parseInt(result[1], 16), g: parseInt(result[2], 16), b: parseInt(result[3], 16) } : {r:255,g:255,b:255};
    }

    function seekToTime(t) {
        return new Promise((resolve) => {
            const target = Math.min(t, Math.max(0, (video.duration || t) - 0.02));
            // If we're already essentially at this time, 'seeked' may never fire —
            // resolve on the next frame instead of hanging forever.
            if (Math.abs(video.currentTime - target) < 0.005) {
                requestAnimationFrame(() => resolve());
                return;
            }
            const onSeeked = () => { video.removeEventListener('seeked', onSeeked); resolve(); };
            video.addEventListener('seeked', onSeeked);
            video.currentTime = target;
        });
    }

    // Real usable duration of the loaded clip. Respects the "擷取長度" field the user can
    // edit; if left blank it falls back to the full video length. Previously this was
    // hardcoded to 2.0s, which silently truncated any longer video.
    function getEffectiveDuration() {
        const vd = video.duration;
        const capInput = document.getElementById('captureDuration');
        const userValue = capInput && capInput.value !== '' ? parseFloat(capInput.value) : null;

        if (userValue && userValue > 0.05) {
            return isFinite(vd) && vd > 0.05 ? Math.min(vd, userValue) : userValue;
        }
        if (isFinite(vd) && vd > 0.05) return vd;
        return 2.0;
    }

    function getFrameCount() {
        const input = document.getElementById('frameCountInput');
        const v = input ? parseInt(input.value) : NaN;
        if (!v || v < 2) return 40;
        return Math.min(v, 120); // sane ceiling to avoid runaway memory/export time
    }

    function updateCaptureDurationHint() {
        const hint = document.getElementById('captureDurationHint');
        const maxFrames = getFrameCount();
        const duration = getEffectiveDuration();
        if (!hint || !duration) return;
        const fps = (maxFrames / duration).toFixed(1);
        hint.innerText = `≈ ${fps} fps (${maxFrames} 幀 / ${duration.toFixed(2)} 秒)`;
    }

    // Cheap perceptual check for "these two frames are basically identical" — used to
    // detect/avoid duplicate frames caused by seeking to two time points that land on
    // the same decoded video frame.
    function framesLookIdentical(a, b) {
        if (!a || !b || a.data.length !== b.data.length) return false;
        const data1 = a.data, data2 = b.data;
        const step = 4 * 23; // sample every ~23rd pixel, cheap but representative
        let diffSum = 0, samples = 0;
        for (let i = 0; i < data1.length; i += step) {
            diffSum += Math.abs(data1[i] - data2[i]) + Math.abs(data1[i + 1] - data2[i + 1]) + Math.abs(data1[i + 2] - data2[i + 2]);
            samples++;
        }
        return samples > 0 && (diffSum / samples) < 3; // near-zero average channel difference
    }

    async function extractAllStickers() {
        const rows = parseInt(document.getElementById('gridRows').value);
        const cols = parseInt(document.getElementById('gridCols').value);
        if (!rows || !cols) return;

        video.pause();
        const duration = getEffectiveDuration();
        const maxFrames = getFrameCount(); 
        const totalFrames = maxFrames;
        const vBounds = [cropBox.left, ...verticalLines, cropBox.right];
        const hBounds = [cropBox.top, ...horizontalLines, cropBox.bottom];

        const enableKeying = document.getElementById('enableKeying').checked;
        const targetColor = hexToRgb(document.getElementById('keyColor').value);
        const tolerance = parseInt(document.getElementById('keyTolerance').value);

        stickerDataMap = {};
        document.getElementById('status').innerText = "⏳ 正在處理拆分...";

        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                const id = r * cols + c + 1;
                const sx = Math.floor(vBounds[c]), sy = Math.floor(hBounds[r]);
                const cellW = Math.floor(vBounds[c + 1] - vBounds[c]);
                const cellH = Math.floor(hBounds[r + 1] - hBounds[r]);

                const workCanvas = document.createElement('canvas');
                workCanvas.width = cellW; workCanvas.height = cellH;
                const workCtx = workCanvas.getContext('2d');

                const frames = []; const masks = [];
                const frameStep = duration / totalFrames;
                const frameDelayMs = frameStep * 1000;

                for (let f = 0; f < totalFrames; f++) {
                    let timePoint = f * frameStep;
                    await seekToTime(timePoint);
                    workCtx.clearRect(0, 0, cellW, cellH);
                    workCtx.drawImage(video, sx, sy, cellW, cellH, 0, 0, cellW, cellH);
                    let imgData = workCtx.getImageData(0, 0, cellW, cellH);

                    // If this frame is basically identical to the one right before it
                    // (happens when the requested time points land on the same decoded
                    // video frame), nudge forward and re-sample instead of keeping the dupe.
                    if (frames.length > 0 && framesLookIdentical(frames[frames.length - 1], imgData)) {
                        const nudged = Math.min(duration - 0.01, timePoint + frameStep * 0.6);
                        await seekToTime(nudged);
                        workCtx.clearRect(0, 0, cellW, cellH);
                        workCtx.drawImage(video, sx, sy, cellW, cellH, 0, 0, cellW, cellH);
                        imgData = workCtx.getImageData(0, 0, cellW, cellH);
                    }
                    
                    const mask = new Uint8Array(cellW * cellH);
                    if (enableKeying) {
                        applyInitialKeying(imgData, mask, targetColor, tolerance);
                    }
                    frames.push(imgData);
                    masks.push(mask);
                }

                stickerDataMap[id] = { 
                    frames, 
                    masks, 
                    frameDelayMs,
                    textConfig: {
                        text: '',
                        dir: 'horiz',
                        layer: 'front',
                        fontFamily: 'sans-serif',
                        fontWeight: 'bold',
                        fontSize: 26,
                        textColor: '#ffffff',
                        strokeColor: '#000000',
                        x: cellW / 2,
                        y: cellH - 25
                    }
                };
            }
        }

        document.getElementById('status').innerText = "✅ 貼圖拆分完成！";
        renderStickerCards();
    }

    // mask[] now stores a continuous 0-255 "how much this pixel is background" value
    // instead of a hard 0/1 flag. 0 = fully keep, 255 = fully remove, values in between
    // give a smooth, anti-aliased edge.
    function applyInitialKeying(imgData, mask, targetColor, tolerance) {
        const data = imgData.data, w = imgData.width, h = imgData.height;

        // Step 1: find the DEFINITE background using a stricter (tighter) tolerance than
        // the user's slider. This is what actually stops the flood fill from tunnelling
        // deep into the subject through pixels that happen to be close to the key color —
        // previously the full (looser) tolerance was used for the entire flood fill.
        const innerTol = tolerance * 0.65;
        const bgMask = floodFillBackground(data, w, h, targetColor, innerTol);

        // Step 2: soft-edge the boundary. Crucially this ramp is only ever applied to
        // pixels that directly touch a background pixel — it can never reach further
        // into the subject than 1px, no matter how loose "tolerance" is set.
        const tR = targetColor.r, tG = targetColor.g, tB = targetColor.b;
        const outerTol = tolerance;

        for (let y = 0; y < h; y++) {
            for (let x = 0; x < w; x++) {
                const idx = y * w + x;
                if (bgMask[idx]) { mask[idx] = 255; continue; }
                if (!isAdjacentToBackground(bgMask, w, h, x, y)) continue;

                const pxIdx = idx * 4;
                const dr = data[pxIdx] - tR, dg = data[pxIdx + 1] - tG, db = data[pxIdx + 2] - tB;
                const dist = Math.sqrt(dr * dr + dg * dg + db * db);

                if (dist <= innerTol) {
                    mask[idx] = 255;
                } else if (dist < outerTol) {
                    const t = (dist - innerTol) / (outerTol - innerTol);
                    mask[idx] = Math.round((1 - t) * 255); // smooth ramp instead of a hard cut
                }
            }
        }

        // Step 3: despill — pull the color of partially-removed edge pixels away from the
        // key color, so no green/white halo is left once composited onto a new background.
        despillEdges(data, mask, w, h, targetColor);
    }

    function floodFillBackground(data, w, h, targetColor, tolerance) {
        const bgMask = new Uint8Array(w * h);
        const visited = new Uint8Array(w * h);
        const queue = [];
        for (let x = 0; x < w; x++) { queue.push(x, 0); queue.push(x, h - 1); }
        for (let y = 1; y < h - 1; y++) { queue.push(0, y); queue.push(w - 1, y); }

        const tR = targetColor.r, tG = targetColor.g, tB = targetColor.b;
        const tolSq = tolerance * tolerance * 3;

        let head = 0;
        while (head < queue.length) {
            const x = queue[head++], y = queue[head++];
            const idx = y * w + x;
            if (visited[idx]) continue;
            visited[idx] = 1;

            const pxIdx = idx * 4;
            const dr = data[pxIdx] - tR, dg = data[pxIdx + 1] - tG, db = data[pxIdx + 2] - tB;
            if (dr * dr + dg * dg + db * db <= tolSq) {
                bgMask[idx] = 1;
                if (x > 0 && !visited[idx - 1]) queue.push(x - 1, y);
                if (x < w - 1 && !visited[idx + 1]) queue.push(x + 1, y);
                if (y > 0 && !visited[idx - w]) queue.push(x, y - 1);
                // BUG FIX: this used to be `queue.push(x, y + w)`, which pushed a
                // y-coordinate offset by the image WIDTH instead of by 1. That silently
                // broke downward flood-fill propagation, leaving ragged, incompletely
                // keyed pixels behind — i.e. the fringing/毛邊.
                if (y < h - 1 && !visited[idx + w]) queue.push(x, y + 1);
            }
        }
        return bgMask;
    }

    function isAdjacentToBackground(bgMask, w, h, x, y) {
        for (let dy = -1; dy <= 1; dy++) {
            for (let dx = -1; dx <= 1; dx++) {
                const nx = x + dx, ny = y + dy;
                if (nx < 0 || nx >= w || ny < 0 || ny >= h) continue;
                if (bgMask[ny * w + nx]) return true;
            }
        }
        return false;
    }

    function despillEdges(data, mask, w, h, targetColor) {
        const tR = targetColor.r, tG = targetColor.g, tB = targetColor.b;
        for (let idx = 0; idx < mask.length; idx++) {
            const a = mask[idx];
            if (a === 0 || a === 255) continue; // only correct partially-transparent edge pixels
            const pxIdx = idx * 4;
            const spill = a / 255;
            data[pxIdx]     -= (tR - data[pxIdx])     * spill * 0.35;
            data[pxIdx + 1] -= (tG - data[pxIdx + 1]) * spill * 0.35;
            data[pxIdx + 2] -= (tB - data[pxIdx + 2]) * spill * 0.35;
        }
    }

    function renderStickerCards() {
        const grid = document.getElementById('stickersGrid');
        grid.innerHTML = '';
        document.getElementById('stickersListSection').style.display = 'block';

        Object.keys(stickerDataMap).forEach(id => {
            const data = stickerDataMap[id];
            const card = document.createElement('div');
            card.className = 'sticker-card';

            const pCanvas = document.createElement('canvas');
            const frame0 = data.frames[0];
            pCanvas.width = frame0.width; pCanvas.height = frame0.height;
            const pCtx = pCanvas.getContext('2d');
            
            renderSingleFrameToCanvas(pCtx, data, 0);

            card.innerHTML = `
                <b style="font-size:0.85rem;">貼圖 #${id}</b>
                <img class="sticker-preview" src="${pCanvas.toDataURL()}">
                <button class="btn btn-sec" style="padding:4px 8px; font-size:0.8rem; min-height:38px;" onclick="openInspectorModal('${id}')">🔍 進入編輯</button>
            `;
            grid.appendChild(card);
        });
    }

    function openInspectorModal(id) {
        activeEditingStickerId = id;
        currentModalFrame = 0;
        undoStack = [];
        
        syncUIWithStickerTextConfig(stickerDataMap[id].textConfig);

        document.getElementById('modalTitle').innerText = `編輯貼圖 #${id}`;
        document.getElementById('editorModal').style.display = 'flex';
        switchTab('preview');
        resetZoom();
        boxSelecting = false;
        const boxOverlay = document.getElementById('boxSelectOverlay');
        if (boxOverlay) boxOverlay.style.display = 'none';
        renderModalFrame();
        setupInteractiveCanvas();
    }

    function syncUIWithStickerTextConfig(cfg) {
        document.getElementById('textContent').value = cfg.text || '';
        document.getElementById('fontFamily').value = cfg.fontFamily;
        document.getElementById('fontWeight').value = cfg.fontWeight;
        document.getElementById('fontSize').value = cfg.fontSize;
        document.getElementById('textColor').value = cfg.textColor;
        document.getElementById('strokeColor').value = cfg.strokeColor;

        updateSegmentUI('btnDirHoriz', 'btnDirVert', cfg.dir === 'horiz');
        updateSegmentUI('btnLayerFront', 'btnLayerBack', cfg.layer === 'front');
    }

    function updateSegmentUI(id1, id2, isFirstActive) {
        const b1 = document.getElementById(id1);
        const b2 = document.getElementById(id2);
        if (isFirstActive) {
            b1.classList.add('active'); b2.classList.remove('active');
        } else {
            b2.classList.add('active'); b1.classList.remove('active');
        }
    }

    function updateCurrentTextConfig(key, value) {
        const sticker = stickerDataMap[activeEditingStickerId];
        if (sticker) {
            sticker.textConfig[key] = value;
            renderModalFrame();
        }
    }

    function closeModal() {
        if (isPlaying) togglePlay();
        document.getElementById('editorModal').style.display = 'none';
    }

    function changeFrame(delta) {
        if (isPlaying) togglePlay();
        const frames = stickerDataMap[activeEditingStickerId].frames;
        if (!frames.length) return;
        currentModalFrame = (currentModalFrame + delta + frames.length) % frames.length;
        renderModalFrame();
    }

    function deleteCurrentFrame() {
        const sticker = stickerDataMap[activeEditingStickerId];
        if (!sticker || sticker.frames.length <= 1) {
            alert('⚠️ 至少需要保留 1 個影格！');
            return;
        }

        if (isPlaying) togglePlay();

        undoStack.push({
            type: 'delete',
            frameIndex: currentModalFrame,
            frameData: sticker.frames[currentModalFrame],
            maskData: sticker.masks[currentModalFrame]
        });

        sticker.frames.splice(currentModalFrame, 1);
        sticker.masks.splice(currentModalFrame, 1);

        if (currentModalFrame >= sticker.frames.length) {
            currentModalFrame = sticker.frames.length - 1;
        }

        renderModalFrame();
    }

    function undoLastAction() {
        if (!undoStack.length) return;
        const last = undoStack.pop();
        const sticker = stickerDataMap[activeEditingStickerId];

        if (last.type === 'delete') {
            sticker.frames.splice(last.frameIndex, 0, last.frameData);
            sticker.masks.splice(last.frameIndex, 0, last.maskData);
            currentModalFrame = last.frameIndex;
        } else if (last.type === 'wand' || last.type === 'box') {
            sticker.masks[last.frameIndex] = last.maskCopy;
        }
        renderModalFrame();
    }

    function togglePlay() {
        isPlaying = !isPlaying;
        const btn = document.getElementById('btnPlay');
        const sticker = stickerDataMap[activeEditingStickerId];
        const frames = sticker.frames;
        if (isPlaying) {
            btn.innerText = "⏸ 暫停預覽";
            const delay = sticker.frameDelayMs || (1000 / 15);
            playInterval = setInterval(() => {
                currentModalFrame = (currentModalFrame + 1) % frames.length;
                renderModalFrame();
            }, delay);
        } else {
            btn.innerText = "⊙ 播放預覽";
            clearInterval(playInterval);
        }
    }

    function renderModalFrame() {
        const sticker = stickerDataMap[activeEditingStickerId];
        if (!sticker || !sticker.frames.length) return;

        const imgData = sticker.frames[currentModalFrame];
        const w = imgData.width, h = imgData.height;

        const canvas = document.getElementById('previewCanvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');

        renderSingleFrameToCanvas(ctx, sticker, currentModalFrame);

        document.getElementById('frameDisplay').innerText = `影格 ${currentModalFrame + 1} / ${sticker.frames.length}`;
        updateCanvasTransform();
    }

    function drawStickerText(ctx, cfg) {
        if (!cfg.text) return;
        ctx.save();
        ctx.font = `${cfg.fontWeight} ${cfg.fontSize}px ${cfg.fontFamily}`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        const lines = cfg.text.split('\n');
        const lineHeight = cfg.fontSize * 1.2;

        if (cfg.dir === 'vert') {
            lines.forEach((line, lIdx) => {
                const chars = line.split('');
                const startY = cfg.y - ((chars.length - 1) * lineHeight) / 2;
                chars.forEach((char, cIdx) => {
                    const cx = cfg.x + (lIdx * lineHeight);
                    const cy = startY + (cIdx * lineHeight);
                    ctx.strokeStyle = cfg.strokeColor;
                    ctx.lineWidth = Math.max(3, cfg.fontSize / 7);
                    ctx.strokeText(char, cx, cy);
                    ctx.fillStyle = cfg.textColor;
                    ctx.fillText(char, cx, cy);
                });
            });
        } else {
            const startY = cfg.y - ((lines.length - 1) * lineHeight) / 2;
            lines.forEach((line, lIdx) => {
                const cy = startY + (lIdx * lineHeight);
                ctx.strokeStyle = cfg.strokeColor;
                ctx.lineWidth = Math.max(3, cfg.fontSize / 7);
                ctx.strokeText(line, cfg.x, cy);
                ctx.fillStyle = cfg.textColor;
                ctx.fillText(line, cfg.x, cy);
            });
        }
        ctx.restore();
    }

    function renderSingleFrameToCanvas(ctx, stickerData, frameIdx) {
        const imgData = stickerData.frames[frameIdx];
        const mask = stickerData.masks[frameIdx];
        const cfg = stickerData.textConfig;
        const w = imgData.width, h = imgData.height;

        const outImgData = ctx.createImageData(w, h);
        const sPx = imgData.data, oPx = outImgData.data;

        for (let i = 0; i < sPx.length; i += 4) {
            const idx = i / 4;
            oPx[i] = sPx[i]; oPx[i+1] = sPx[i+1]; oPx[i+2] = sPx[i+2];
            // mask[idx] is 0-255 "how much background" — blend instead of a hard cut.
            oPx[i+3] = Math.round(sPx[i+3] * (1 - mask[idx] / 255));
        }

        ctx.clearRect(0, 0, w, h);

        if (cfg.layer === 'back') drawStickerText(ctx, cfg);

        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = w; tempCanvas.height = h;
        tempCanvas.getContext('2d').putImageData(outImgData, 0, 0);
        ctx.drawImage(tempCanvas, 0, 0);

        if (cfg.layer === 'front') drawStickerText(ctx, cfg);
    }

    function getExactCanvasCoords(clientX, clientY) {
        const canvas = document.getElementById('previewCanvas');
        const rect = canvas.getBoundingClientRect();
        
        const relX = (clientX - rect.left) / rect.width;
        const relY = (clientY - rect.top) / rect.height;

        return {
            x: Math.floor(relX * canvas.width),
            y: Math.floor(relY * canvas.height)
        };
    }

    function setupInteractiveCanvas() {
        const container = document.getElementById('previewContainer');

        const handleStart = (e) => {
            if (e.touches && e.touches.length === 2) {
                initialPinchDistance = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                return;
            }

            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            const sticker = stickerDataMap[activeEditingStickerId];
            const cfg = sticker.textConfig;

            // Box-select drags a rectangle across the canvas — skip the "drag the text"
            // shortcut here so a drag starting near the text doesn't get hijacked.
            if (currentMode !== 'box' && cfg.text) {
                const p = getExactCanvasCoords(clientX, clientY);
                const distToText = Math.hypot(p.x - cfg.x, p.y - cfg.y);
                if (distToText < 35) {
                    isDraggingText = true;
                    return;
                }
            }

            if (currentMode === 'pan') {
                isPanning = true;
                startPan = { x: clientX - panOffset.x, y: clientY - panOffset.y };
            } else if (currentMode === 'wand') {
                const p = getExactCanvasCoords(clientX, clientY);
                executeMagicWand(p.x, p.y);
            } else if (currentMode === 'box') {
                boxSelecting = true;
                boxSelectStartClient = { x: clientX, y: clientY };
                boxSelectCurrentClient = { x: clientX, y: clientY };
                const boxOverlay = document.getElementById('boxSelectOverlay');
                boxOverlay.style.display = 'block';
                updateBoxOverlay();
            }
        };

        const handleMove = (e) => {
            if (e.touches && e.touches.length === 2 && initialPinchDistance) {
                const dist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                const factor = dist / initialPinchDistance;
                zoomScale = Math.min(Math.max(0.8, zoomScale * factor), 5);
                initialPinchDistance = dist;
                updateCanvasTransform();
                return;
            }

            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            if (boxSelecting) {
                boxSelectCurrentClient = { x: clientX, y: clientY };
                updateBoxOverlay();
                return;
            }

            if (isDraggingText) {
                const p = getExactCanvasCoords(clientX, clientY);
                const sticker = stickerDataMap[activeEditingStickerId];
                sticker.textConfig.x = p.x;
                sticker.textConfig.y = p.y;
                renderModalFrame();
            } else if (isPanning) {
                panOffset.x = clientX - startPan.x;
                panOffset.y = clientY - startPan.y;
                updateCanvasTransform();
            }
        };

        const handleEnd = () => {
            if (boxSelecting) {
                applyBoxSelection(boxSelectStartClient.x, boxSelectStartClient.y, boxSelectCurrentClient.x, boxSelectCurrentClient.y);
                boxSelecting = false;
                document.getElementById('boxSelectOverlay').style.display = 'none';
            }
            isDraggingText = false;
            isPanning = false;
            initialPinchDistance = null;
        };

        container.onmousedown = handleStart;
        window.onmousemove = handleMove;
        window.onmouseup = handleEnd;

        container.ontouchstart = handleStart;
        window.ontouchmove = handleMove;
        window.ontouchend = handleEnd;
    }

    function toggleInteractionMode() {
        const btn = document.getElementById('btnModeToggle');
        const badge = document.getElementById('modeBadge');
        if (currentMode === 'wand') {
            currentMode = 'box';
            btn.innerText = "▭ 框選模式";
            btn.classList.add('active');
            badge.innerText = "▭ 框選去背模式";
        } else if (currentMode === 'box') {
            currentMode = 'pan';
            btn.innerText = "🖐️ 平移模式";
            btn.classList.remove('active');
            badge.innerText = "🖐️ 畫布拖曳/縮放模式";
        } else {
            currentMode = 'wand';
            btn.innerText = "🪄 去背模式";
            btn.classList.add('active');
            badge.innerText = "🪄 點擊去背模式";
        }
    }

    // Positions the dashed selection rectangle over the drag, in screen space —
    // this only needs to look right on screen, so no zoom/pan math is needed here.
    function updateBoxOverlay() {
        const overlay = document.getElementById('boxSelectOverlay');
        const container = document.getElementById('previewContainer');
        const rect = container.getBoundingClientRect();

        const x1 = boxSelectStartClient.x - rect.left;
        const y1 = boxSelectStartClient.y - rect.top;
        const x2 = boxSelectCurrentClient.x - rect.left;
        const y2 = boxSelectCurrentClient.y - rect.top;

        overlay.style.left = Math.min(x1, x2) + 'px';
        overlay.style.top = Math.min(y1, y2) + 'px';
        overlay.style.width = Math.abs(x2 - x1) + 'px';
        overlay.style.height = Math.abs(y2 - y1) + 'px';
    }

    // Converts the drag's two screen-space corners into canvas pixel coordinates
    // (getExactCanvasCoords already accounts for zoom/pan) and flips every pixel in
    // that rectangle to fully-removed (or, with 框選還原 checked, fully restored).
    function applyBoxSelection(clientX1, clientY1, clientX2, clientY2) {
        const sticker = stickerDataMap[activeEditingStickerId];
        const mask = sticker.masks[currentModalFrame];
        const imgData = sticker.frames[currentModalFrame];
        const w = imgData.width, h = imgData.height;

        const p1 = getExactCanvasCoords(clientX1, clientY1);
        const p2 = getExactCanvasCoords(clientX2, clientY2);

        const minX = Math.max(0, Math.min(p1.x, p2.x));
        const maxX = Math.min(w - 1, Math.max(p1.x, p2.x));
        const minY = Math.max(0, Math.min(p1.y, p2.y));
        const maxY = Math.min(h - 1, Math.max(p1.y, p2.y));

        // Ignore accidental taps that didn't really drag a rectangle.
        if ((maxX - minX) < 3 || (maxY - minY) < 3) return;

        undoStack.push({ type: 'box', frameIndex: currentModalFrame, maskCopy: new Uint8Array(mask) });

        const restoreMode = document.getElementById('boxInverseMode').checked;
        const newValue = restoreMode ? 0 : 255;

        for (let y = minY; y <= maxY; y++) {
            const rowStart = y * w;
            for (let x = minX; x <= maxX; x++) {
                mask[rowStart + x] = newValue;
            }
        }

        renderModalFrame();
    }

    function updateCanvasTransform() {
        const canvas = document.getElementById('previewCanvas');
        canvas.style.transform = `translate(${panOffset.x}px, ${panOffset.y}px) scale(${zoomScale})`;
    }

    function resetZoom() {
        zoomScale = 1;
        panOffset = { x: 0, y: 0 };
        updateCanvasTransform();
    }

    function executeMagicWand(clickX, clickY) {
        const sticker = stickerDataMap[activeEditingStickerId];
        const imgData = sticker.frames[currentModalFrame];
        const mask = sticker.masks[currentModalFrame];
        const w = imgData.width, h = imgData.height;

        if (clickX < 0 || clickX >= w || clickY < 0 || clickY >= h) return;

        undoStack.push({ type: 'wand', frameIndex: currentModalFrame, maskCopy: new Uint8Array(mask) });

        const startIdx = (clickY * w + clickX) * 4;
        const tR = imgData.data[startIdx], tG = imgData.data[startIdx+1], tB = imgData.data[startIdx+2];
        const tol = parseInt(document.getElementById('modalTolRange').value);
        const tolSq = tol * tol * 3;

        const queue = [clickX, clickY];
        const visited = new Uint8Array(w * h);

        while (queue.length > 0) {
            const y = queue.pop(), x = queue.pop();
            const idx = y * w + x;
            if (visited[idx]) continue;
            visited[idx] = 1;

            const pxIdx = idx * 4;
            const dr = imgData.data[pxIdx] - tR, dg = imgData.data[pxIdx+1] - tG, db = imgData.data[pxIdx+2] - tB;

            if (dr*dr + dg*dg + db*db <= tolSq) {
                mask[idx] = 255;
                if (x > 0) queue.push(x - 1, y);
                if (x < w - 1) queue.push(x + 1, y);
                if (y > 0) queue.push(x, y - 1);
                if (y < h - 1) queue.push(x, y + 1);
            }
        }

        renderModalFrame();
    }

    function setBg(type, btn) {
        document.getElementById('previewContainer').className = `preview-box bg-${type}`;
        document.querySelectorAll('.bg-toggle-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    function setTextLayer(pos, btn) {
        updateCurrentTextConfig('layer', pos);
        updateSegmentUI('btnLayerFront', 'btnLayerBack', pos === 'front');
    }

    function setTextDir(dir, btn) {
        updateCurrentTextConfig('dir', dir);
        updateSegmentUI('btnDirHoriz', 'btnDirVert', dir === 'horiz');
    }

    function saveModalChanges() {
        closeModal();
        renderStickerCards();
    }

    async function exportAllStickersZip() {
        const exportBtn = document.getElementById('exportBtn');
        const formatMode = document.getElementById('exportFormatSelect').value;
        const progressContainer = document.getElementById('progressContainer');
        const progressText = document.getElementById('progressText');
        const progressPercent = document.getElementById('progressPercent');
        const progressBarFill = document.getElementById('progressBarFill');
        
        try {
            exportBtn.disabled = true;
            progressContainer.style.display = 'block';
            
            const updateProgress = (text, percent) => {
                progressText.innerText = text;
                progressPercent.innerText = `${percent}%`;
                progressBarFill.style.width = `${percent}%`;
            };

            updateProgress("準備生成打包檔...", 0);

            const zip = new JSZip();
            const stickerIds = Object.keys(stickerDataMap);
            const totalStickers = stickerIds.length;

            for (let idx = 0; idx < totalStickers; idx++) {
                const id = stickerIds[idx];
                const currentPercent = Math.floor((idx / totalStickers) * 80);
                updateProgress(`正在處理貼圖 #${id}...`, currentPercent);

                await new Promise(r => setTimeout(r, 20));

                const sticker = stickerDataMap[id];
                const cellW = sticker.frames[0].width;
                const cellH = sticker.frames[0].height;
                const perFrameDelay = Math.max(20, Math.round(sticker.frameDelayMs || (1000 / 15))); // 20ms floor per APNG spec practice

                const c = document.createElement('canvas');
                c.width = cellW; c.height = cellH;
                const cCtx = c.getContext('2d');

                if (formatMode === 'apng') {
                    const framesArray = [];
                    const delaysArray = [];

                    for (let f = 0; f < sticker.frames.length; f++) {
                        cCtx.clearRect(0, 0, cellW, cellH);
                        renderSingleFrameToCanvas(cCtx, sticker, f);

                        const finalData = cCtx.getImageData(0, 0, cellW, cellH);
                        framesArray.push(new Uint8Array(finalData.data.buffer).buffer);
                        delaysArray.push(perFrameDelay);
                    }

                    const apngBuffer = UPNG.encode(framesArray, cellW, cellH, 0, delaysArray);
                    zip.file(`sticker_${id}.png`, apngBuffer);

                } else {
                    const stickerFolder = zip.folder(`sticker_${id}_frames`);

                    for (let f = 0; f < sticker.frames.length; f++) {
                        cCtx.clearRect(0, 0, cellW, cellH);
                        renderSingleFrameToCanvas(cCtx, sticker, f);

                        const frameNum = String(f + 1).padStart(2, '0');
                        const dataUrl = c.toDataURL('image/png');
                        const base64Data = dataUrl.replace(/^data:image\/png;base64,/, "");
                        stickerFolder.file(`frame_${frameNum}.png`, base64Data, { base64: true });
                    }
                }
            }

            updateProgress("正在打包 ZIP...", 90);
            const blob = await zip.generateAsync({ type: "blob" });

            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `LINE_stickers_${formatMode}_pack.zip`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            setTimeout(() => { progressContainer.style.display = 'none'; }, 2000);

        } catch (err) {
            console.error(err);
            progressText.innerText = "❌ 打包失敗: " + err.message;
            progressBarFill.style.background = "#ef4444";
        } finally {
            exportBtn.disabled = false;
        }
    }
</script>
